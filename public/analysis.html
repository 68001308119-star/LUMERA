<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>LUMERA - วิเคราะห์สไตล์</title>

    <link rel="stylesheet"
        href="css/style.css">

</head>


<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">
            LUMERA
        </div>

        <nav class="nav-menu">

            <a href="index.html">
                หน้าแรก
            </a>

            <a href="analysis.html">
                วิเคราะห์สไตล์
            </a>

            <a href="#">
                ทรงผม
            </a>

            <a href="#">
                AI Chat
            </a>

        </nav>

    </header>


    <!-- Analysis Page -->
    <main>

        <section class="analysis-page">

            <div class="analysis-header">

                <p class="eyebrow">
                    LUMERA ANALYSIS
                </p>

                <h1>
                    ค้นหาสไตล์ที่เหมาะกับคุณ
                </h1>

                <p>
                    ตอบคำถามสั้น ๆ
                    เพื่อให้ LUMERA
                    สามารถแนะนำสไตล์ที่เหมาะกับคุณ
                </p>

            </div>


            <!-- Gender -->
            <div class="analysis-box">

                <h2>
                    01. คุณต้องการคำแนะนำสำหรับ
                </h2>

                <p class="question-description">
                    เลือกตัวเลือกที่ต้องการ
                </p>


                <div class="choice-grid">

                    <button class="choice-button">

                        <span class="choice-icon">
                            ♀
                        </span>

                        <span>
                            ผู้หญิง
                        </span>

                    </button>


                    <button class="choice-button">

                        <span class="choice-icon">
                            ♂
                        </span>

                        <span>
                            ผู้ชาย
                        </span>

                    </button>


                    <button class="choice-button">

                        <span class="choice-icon">
                            ○
                        </span>

                        <span>
                            ไม่ระบุ
                        </span>

                    </button>

                </div>

            </div>


            <!-- Beauty Categories -->
            <div class="analysis-box">

                <h2>
                    02. คุณต้องการคำแนะนำด้านใด?
                </h2>

                <p class="question-description">
                    สามารถเลือกได้มากกว่า 1 รายการ
                </p>


                <div class="category-grid">

                    <button class="category-button">
                        💇 ทรงผม
                    </button>

                    <button class="category-button">
                        💄 การแต่งหน้า
                    </button>

                    <button class="category-button">
                        👗 การแต่งตัว
                    </button>

                    <button class="category-button">
                        🎨 สีที่เหมาะกับฉัน
                    </button>

                    <button class="category-button">
                        ✨ สไตล์โดยรวม
                    </button>

                    <button class="category-button">
                        🧴 การดูแลผิว
                    </button>

                </div>

            </div>


            <!-- Continue -->
            <div class="analysis-next">

                <button class="continue-button">
                    ดำเนินการต่อ
                    →
                </button>

            </div>

        </section>

    </main>
    
    <script src="js/analysis.js"></script>

</body>

</html>
