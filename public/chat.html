<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LUMERA | AI Beauty Chat</title>

    <meta
        name="description"
        content="พูดคุยกับ LUMERA AI เพื่อขอคำแนะนำด้านความงาม ทรงผม การแต่งตัว สี และ Personal Style"
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .chat-page {
            min-height: calc(100vh - 80px);
            background: #F8F6F2;
            padding: 70px 20px;
        }

        .chat-container {
            width: min(900px, 100%);
            margin: 0 auto;
        }

        .chat-heading {
            text-align: center;
            margin-bottom: 40px;
        }

        .chat-eyebrow {
            font-family: "Inter", sans-serif;
            font-size: 12px;
            letter-spacing: 3px;
            color: #806F64;
            margin-bottom: 16px;
        }

        .chat-heading h1 {
            font-family: "Playfair Display", serif;
            font-size: clamp(42px, 7vw, 68px);
            font-weight: 500;
            color: #292725;
            margin: 0 0 18px;
        }

        .chat-heading p {
            font-family: "Noto Sans Thai", sans-serif;
            color: #806F64;
            line-height: 1.8;
            margin: 0 auto;
            max-width: 600px;
        }

        .chat-box {
            background: #FFFFFF;
            border: 1px solid #E5E1DC;
            overflow: hidden;
        }

        .chat-messages {
            min-height: 430px;
            max-height: 500px;
            overflow-y: auto;
            padding: 30px;
        }

        .message {
            display: flex;
            margin-bottom: 20px;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 75%;
            padding: 15px 18px;
            font-family: "Noto Sans Thai", sans-serif;
            font-size: 14px;
            line-height: 1.8;
        }

        .message.ai .message-content {
            background: #F8F6F2;
            color: #292725;
        }

        .message.user .message-content {
            background: #292725;
            color: #FFFFFF;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 18px;
            border-top: 1px solid #E5E1DC;
            background: #FFFFFF;
        }

        .chat-input {
            flex: 1;
            border: 1px solid #E5E1DC;
            outline: none;
            padding: 14px 16px;
            font-family: "Noto Sans Thai", sans-serif;
            font-size: 14px;
            color: #292725;
            background: #FFFFFF;
        }

        .chat-input:focus {
            border-color: #B7AAA0;
        }

        .chat-send {
            border: none;
            background: #292725;
            color: #FFFFFF;
            padding: 0 25px;
            cursor: pointer;
            font-family: "Noto Sans Thai", sans-serif;
            font-size: 14px;
        }

        .chat-send:hover {
            opacity: 0.85;
        }

        .chat-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-loading {
            font-family: "Noto Sans Thai", sans-serif;
            color: #806F64;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            .chat-page {
                padding: 50px 15px;
            }

            .chat-messages {
                padding: 20px;
                min-height: 400px;
            }

            .message-content {
                max-width: 88%;
            }

            .chat-input-area {
                padding: 12px;
            }

            .chat-send {
                padding: 0 18px;
            }

        }

    </style>

</head>


<body>

    <header class="navbar">

        <div class="logo">
            LUMERA
        </div>

        <nav class="nav-menu">

            <a href="index.html">
                หน้าแรก
            </a>

            <a href="analysis.html">
                วิเคราะห์สไตล์
            </a>

            <a href="hairstyle.html">
                ทรงผม
            </a>

            <a href="chat.html">
                AI Chat
            </a>

        </nav>

    </header>


    <main class="chat-page">

        <div class="chat-container">

            <section class="chat-heading">

                <p class="chat-eyebrow">
                    LUMERA AI CHAT
                </p>

                <h1>
                    BEAUTY CHAT
                </h1>

                <p>
                    พูดคุยกับ LUMERA AI
                    เพื่อขอคำแนะนำเกี่ยวกับทรงผม
                    การแต่งตัว สี และ Personal Style
                </p>

            </section>


            <section class="chat-box">

                <div
                    class="chat-messages"
                    id="chatMessages"
                >

                    <div class="message ai">

                        <div class="message-content">
                            สวัสดีค่ะ ✨
                            ฉันคือ LUMERA AI
                            สามารถช่วยแนะนำเรื่องทรงผม
                            การแต่งตัว สี และ Personal Style
                            ให้คุณได้ค่ะ
                        </div>

                    </div>

                </div>


                <div class="chat-input-area">

                    <input
                        type="text"
                        id="chatInput"
                        class="chat-input"
                        placeholder="พิมพ์คำถามของคุณ..."
                        autocomplete="off"
                    >

                    <button
                        id="sendButton"
                        class="chat-send"
                    >
                        ส่ง
                    </button>

                </div>

            </section>

        </div>

    </main>


    <script>

        const chatInput =
            document.getElementById("chatInput");

        const sendButton =
            document.getElementById("sendButton");

        const chatMessages =
            document.getElementById("chatMessages");


        function addMessage(
            message,
            type
        ) {

            const messageElement =
                document.createElement("div");

            messageElement.className =
                `message ${type}`;

            const content =
                document.createElement("div");

            content.className =
                "message-content";

            content.textContent =
                message;

            messageElement.appendChild(
                content
            );

            chatMessages.appendChild(
                messageElement
            );

            chatMessages.scrollTop =
                chatMessages.scrollHeight;
        }


        async function sendMessage() {

            const message =
                chatInput.value.trim();

            if (!message) {
                return;
            }

            addMessage(
                message,
                "user"
            );

            chatInput.value = "";

            sendButton.disabled = true;

            const loading =
                document.createElement("div");

            loading.className =
                "message ai";

            loading.id =
                "loadingMessage";

            loading.innerHTML = `
                <div class="message-content chat-loading">
                    LUMERA AI กำลังคิด...
                </div>
            `;

            chatMessages.appendChild(
                loading
            );

            chatMessages.scrollTop =
                chatMessages.scrollHeight;


            try {

                const response =
                    await fetch(
                        "/api/chat",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                message: message
                            })
                        }
                    );


                const data =
                    await response.json();


                const loadingMessage =
                    document.getElementById(
                        "loadingMessage"
                    );

                if (loadingMessage) {
                    loadingMessage.remove();
                }


                if (
                    data.success
                ) {

                    addMessage(
                        data.result,
                        "ai"
                    );

                } else {

                    addMessage(
                        "ขออภัยค่ะ ไม่สามารถตอบคำถามได้ในขณะนี้",
                        "ai"
                    );

                }


            } catch (error) {

                const loadingMessage =
                    document.getElementById(
                        "loadingMessage"
                    );

                if (loadingMessage) {
                    loadingMessage.remove();
                }

                addMessage(
                    "เกิดข้อผิดพลาดในการเชื่อมต่อกับ LUMERA AI",
                    "ai"
                );

            }


            sendButton.disabled =
                false;

            chatInput.focus();

        }


        sendButton.addEventListener(
            "click",
            sendMessage
        );


        chatInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter"
                ) {

                    sendMessage();

                }

            }
        );

    </script>

</body>

</html>
