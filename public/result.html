<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LUMERA - ผลการวิเคราะห์</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="logo">
            LUMERA
        </div>


        <nav class="nav-menu">

            <a href="index.html">
                หน้าแรก
            </a>

            <a href="analysis.html">
                วิเคราะห์สไตล์
            </a>

            <a href="#">
                ทรงผม
            </a>

            <a href="#">

            </a>

        </nav>

    </header>



    <!-- =========================
         MAIN
    ========================== -->

    <main>

        <section class="result-page">


            <!-- HEADER -->

            <div class="result-header">

                <p class="eyebrow">
                    LUMERA AI ANALYSIS
                </p>

                <h1>
                    ผลการวิเคราะห์สไตล์
                </h1>

                <p>
                    คำแนะนำเฉพาะบุคคล
                    จาก LUMERA AI
                </p>

            </div>



            <!-- =========================
                 PROFILE
            ========================== -->

            <div class="result-profile">


                <div
                    class="result-profile-image"
                    id="resultProfileImage"
                >

                </div>


                <div class="result-profile-info">

                    <p class="result-label">
                        YOUR LUMERA STYLE
                    </p>

                    <h2 id="styleTitle">
                        LUMERA STYLE
                    </h2>

                    <p id="styleDescription">
                        กำลังประมวลผลคำแนะนำ

                    </p>

                </div>

            </div>



            <!-- =========================
                 AI RESULT
            ========================== -->

            <div class="result-section">


                <div class="result-section-title">

                    <p class="eyebrow">
                        AI RECOMMENDATIONS
                    </p>

                    <h2>
                        คำแนะนำสำหรับคุณ
                    </h2>

                </div>


                <div
                    id="aiResult"
                    class="ai-result-container"
                >

                    <p>
                        กำลังโหลดผลการวิเคราะห์...
                    </p>

                </div>

            </div>



            <!-- =========================
                 ACTION
            ========================== -->

            <div class="result-action">

                <a
                    href="analysis.html"
                    class="start-button"
                >
                    วิเคราะห์ใหม่
                </a>

            </div>


        </section>

    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/result.js"></script>

</html>
